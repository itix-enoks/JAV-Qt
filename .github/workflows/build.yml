# Builds JAV-Qt for Linux, Windows and macOS on every push. Pushing a version
# tag (e.g. v0.1.0) also publishes the packages as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.10.3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04  # oldest supported glibc, so the AppImage runs on more distributions
            qt-arch: linux_gcc_64
          - name: windows-x86_64
            os: windows-2022
            qt-arch: win64_msvc2022_64
          - name: macos-arm64
            os: macos-14
            qt-arch: clang_64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          project_version=$(sed -nE 's/^ *VERSION ([0-9.]+)$/\1/p' CMakeLists.txt | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ "$version" != "$project_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $project_version in CMakeLists.txt"
              exit 1
            fi
          else
            version="$project_version-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libgl1-mesa-dev libegl1 libfontconfig1 libfreetype6 \
            libdbus-1-3 libgssapi-krb5-2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          aqtversion: '==3.3.*'
          cache: true

      - name: Configure
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DJAVQT_BUNDLED_DEPS=ON -DJAVQT_FONTS_FROM_SOURCE=OFF)
          case "$RUNNER_OS" in
            Linux) args+=(-G Ninja -DCMAKE_INSTALL_PREFIX=/usr) ;;
            macOS) args+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0) ;;
          esac
          cmake -S . -B build "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1  # no FUSE needed on the runner
          LINUXDEPLOY_OUTPUT_VERSION: ${{ env.VERSION }}
        run: |
          DESTDIR=AppDir cmake --install build
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          QMAKE="$QT_ROOT_DIR/bin/qmake" ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/jav-qt.desktop --output appimage
          mkdir dist
          mv JAV-Qt-*.AppImage "dist/JAV-Qt-$VERSION-linux-x86_64.AppImage"
          echo "APP=dist/JAV-Qt-$VERSION-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        run: |
          # Qt's deploy step needs an absolute prefix; `pwd -W` gives D:/... instead of /d/...
          cmake --install build --config Release --prefix "$(pwd -W)/staging/JAV-Qt"
          echo "APP=staging/JAV-Qt/JAV-Qt.exe" >> "$GITHUB_ENV"
          mkdir dist
          (cd staging && 7z a -tzip "../dist/JAV-Qt-$VERSION-windows-x86_64.zip" JAV-Qt)

      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        run: |
          cmake --install build --config Release --prefix "$PWD/staging"  # Qt's deploy step needs it absolute
          # Deploying Qt rewrites the binaries; Apple Silicon only runs signed code,
          # so sign the bundle again (ad hoc: no Apple developer account involved)
          codesign --force --deep --sign - staging/JAV-Qt.app
          echo "APP=staging/JAV-Qt.app/Contents/MacOS/JAV-Qt" >> "$GITHUB_ENV"
          ln -s /Applications staging/Applications
          mkdir dist
          hdiutil create -volname JAV-Qt -srcfolder staging -ov -format UDZO "dist/JAV-Qt-$VERSION-macos-arm64.dmg"

      # Starts the packaged app: it must find its fonts, HTTPS and image support
      - name: Self-test package
        env:
          JAVQT_DATA_DIR: ${{ runner.temp }}/self-test
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          status=0
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a "$APP" --self-test || status=$?
          else
            "$APP" --self-test || status=$?
          fi
          cat "$JAVQT_DATA_DIR/jav-qt.log" || true
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: JAV-Qt-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
